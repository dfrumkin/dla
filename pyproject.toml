[project]
name = "dla"
version = "0.1.0"
description = "Environment for the Deep Learning for Audio course notebooks"
requires-python = ">=3.13,<3.14"
dependencies = [
    # core
    "torch",
    "torchaudio",
    "torchcodec",  # backend for torchaudio.load (torchaudio >= 2.9); needs FFmpeg (brew install ffmpeg)
    "torchvision",
    "numpy",
    "scipy",
    # audio
    "soundfile",
    "torchaudio-filters",
    "librosa",
    # other notebooks
    "matplotlib",
    "seaborn",
    "tqdm",
    "editdistance",
    "transformers",
    # Jupyter in VS Code
    "ipykernel",
    "ipywidgets",
]

[tool.uv]
package = false
